openapi: 3.0.3
info:
  title: Dental Clinic API
  version: 1.0.0
  description: Comprehensive API contract for all `/api/v1` routes.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: Auth }
  - { name: Users }
  - { name: Config }
  - { name: Patients }
  - { name: Appointments }
  - { name: Scheduling }
  - { name: Recalls }
  - { name: Billing }
  - { name: Inventory }
  - { name: Clinical }
  - { name: AI }
  - { name: Reports }
  - { name: Audit }
paths:
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login and issue token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device_name]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                device_name: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/me:
    get:
      tags: [Auth]
      summary: Current authenticated user
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout current token
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Logout all sessions
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /users:
    get: { tags: [Users], summary: List users, responses: { '200': { $ref: '#/components/responses/Ok' } } }
    post: { tags: [Users], summary: Create user, responses: { '201': { $ref: '#/components/responses/Created' } } }
  /users/{user}:
    get: { tags: [Users], summary: Show user, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
    put: { tags: [Users], summary: Update user, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
    delete: { tags: [Users], summary: Delete user, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '204': { $ref: '#/components/responses/NoContent' } } }

  /operatories:
