components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
  responses:
    Ok:
      description: Successful response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiSuccess'
    Created:
      description: Resource created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiSuccess'
    NoContent:
      description: Empty response
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiSuccess:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, nullable: true }
        data: { type: object, nullable: true, additionalProperties: true }
        meta: { type: object, nullable: true, additionalProperties: true }
    ApiError:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
        errors: { type: object, nullable: true, additionalProperties: true }
  parameters:
    UserId: { name: user, in: path, required: true, schema: { type: integer } }
    OperatoryId: { name: operatory, in: path, required: true, schema: { type: integer } }
    AppointmentTypeId: { name: appointmentType, in: path, required: true, schema: { type: integer } }
    ProcedureCodeId: { name: procedureCode, in: path, required: true, schema: { type: integer } }
    PaymentMethodId: { name: paymentMethod, in: path, required: true, schema: { type: integer } }
    ProviderId: { name: provider, in: path, required: true, schema: { type: integer } }
    PatientId: { name: patient, in: path, required: true, schema: { type: integer } }
    ContactId: { name: contact, in: path, required: true, schema: { type: integer } }
    AllergyId: { name: allergy, in: path, required: true, schema: { type: integer } }
    ConditionId: { name: condition, in: path, required: true, schema: { type: integer } }
    MedicationId: { name: medication, in: path, required: true, schema: { type: integer } }
    ConsentId: { name: consent, in: path, required: true, schema: { type: integer } }
    MedicalCaseId: { name: medicalCase, in: path, required: true, schema: { type: integer } }
    DocumentId: { name: document, in: path, required: true, schema: { type: integer } }
    AppointmentId: { name: appointment, in: path, required: true, schema: { type: integer } }
