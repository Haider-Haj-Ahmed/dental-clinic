          schema:
            type: object
            properties:
              data:
                type: object
                description: Report payload (structure varies per report)

  schemas:

    # ── Shared ────────────────────────────────────────────────────────────────

    PaginatedMeta:
      type: object
      properties:
        meta:
          type: object
          properties:
            current_page:
              type: integer
            last_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
        links:
          type: object
          properties:
            first:
              type: string
            last:
              type: string
            prev:
              type: string
              nullable: true
            next:
              type: string
              nullable: true

    ErrorResponse:
      type: object
      properties:
        message:
          type: string

    ValidationErrorResponse:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    # ── Enums ─────────────────────────────────────────────────────────────────

    UserRole:
      type: string
      enum: [owner, receptionist, provider, assistant]

    AppointmentStatus:
      type: string
      enum: [scheduled, confirmed, completed, cancelled, no_show]

    RecallStatus:
      type: string
      enum: [pending, sent, booked, dismissed]

    InvoiceStatus:
      type: string
      enum: [draft, finalized, paid, partial, void]

    DocumentType:
      type: string
      enum:
        - xray
        - panoramic
        - cephalometric
        - intraoral_photo
        - lab_result
        - referral_letter
        - consent_form
        - old_treatment_record
        - prescription_scan
        - other

    MedicalCaseType:
      type: string
      enum:
        - examination
        - extraction
        - filling
        - root_canal
        - crown
        - implant
        - orthodontics
        - periodontal
        - surgery
        - consultation
        - other

    OdontogramEntryType:
      type: string
      enum: [condition, procedure]

    PerioSite:
      type: string
      enum: [MB, B, DB, ML, L, DL]

    StockMovementType:
      type: string
      enum: [in, out, adjustment, expired]

    AiAnalysisType:
      type: string
      enum: [xray_analysis, soap_suggestion, prescription_suggestion, perio_risk]

    AiResultStatus:
      type: string
      enum: [pending, accepted, dismissed]

    # ── Auth ──────────────────────────────────────────────────────────────────

    LoginRequest:
      type: object
      required: [email, password, device_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        device_name:
          type: string
          maxLength: 255

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        abilities:
          type: array
          items:
            type: string
        user:
          $ref: '#/components/schemas/User'

    # ── Models ────────────────────────────────────────────────────────────────

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    StoreUserRequest:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role:
          $ref: '#/components/schemas/UserRole'

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role:
          $ref: '#/components/schemas/UserRole'

    Operatory:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        color:
          type: string
          example: '#3B82F6'
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    StoreOperatoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          nullable: true
        is_active:
          type: boolean
          default: true

    AppointmentType:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        duration_minutes:
          type: integer
          nullable: true
        color:
          type: string
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    StoreAppointmentTypeRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        duration_minutes:
          type: integer
          nullable: true
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          nullable: true
        is_active:
          type: boolean
          default: true

    ProcedureCode:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        description:
          type: string
        fee_default:
          type: number
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    StoreProcedureCodeRequest:
      type: object
      required: [code, description]
      properties:
        code:
          type: string
          maxLength: 20
        description:
          type: string
          maxLength: 255
        fee_default:
          type: number
          minimum: 0
          default: 0
        is_active:
          type: boolean
          default: true

    PaymentMethod:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    StorePaymentMethodRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        is_active:
          type: boolean
          default: true

    Provider:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
          nullable: true
        operatory_id:
          type: integer
          nullable: true
        name:
          type: string
        specialty:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        license_number:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    StoreProviderRequest:
      type: object
      required: [name]
