        '200':
          $ref: '#/components/responses/OperatoryItem'
    put:
      tags: [Operatories]
      summary: Update an operatory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreOperatoryRequest'
      responses:
        '200':
          $ref: '#/components/responses/OperatoryItem'
    delete:
      tags: [Operatories]
      summary: Delete an operatory
      responses:
        '204':
          description: Deleted

  # ── APPOINTMENT TYPES ─────────────────────────────────────────────────────

  /appointment-types:
