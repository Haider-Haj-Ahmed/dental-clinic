      security:
        - sanctum: [patients:read]
      responses:
        '200':
          $ref: '#/components/responses/PatientAllergyItem'
    put:
      tags: [Patient Sub-Resources]
      summary: Update an allergy
      security:
        - sanctum: [patients:write]
      requestBody:
