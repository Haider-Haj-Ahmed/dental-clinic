  # ── PATIENTS ──────────────────────────────────────────────────────────────

  /patients:
    get:
      tags: [Patients]
      summary: List patients
      security:
        - sanctum: [patients:read]
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
