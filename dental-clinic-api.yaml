    post:
      tags: [Patients]
      summary: Archive a patient
      security:
        - sanctum: [patients:write]
      responses:
        '200':
          $ref: '#/components/responses/PatientItem'

  /patients/{patient}/restore:
    parameters:
      - name: patient
        in: path
        required: true
        schema:
          type: integer
    post:
      tags: [Patients]
      summary: Restore an archived patient
      security:
        - sanctum: [patients:write]
      responses:
        '200':
          $ref: '#/components/responses/PatientItem'

  /patients/{patient}/timeline:
    parameters:
      - name: patient
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Patients]
      summary: Unified chronological timeline for a patient
      security:
        - sanctum: [patients:read]
      parameters:
        - name: type[]
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [appointment, medical_case, document, encounter, prescription]
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Paginated timeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineResponse'

  /patients/{patient}/ledger:
    parameters:
      - name: patient
        in: path
        required: true
        schema:
