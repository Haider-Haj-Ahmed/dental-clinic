          items:
            $ref: '#/components/schemas/PrescriptionItem'

    PrescriptionItem:
      description: "Source: PrescriptionItemResource"
      type: object
      properties:
        id:
          type: integer
        prescription_id:
          type: integer
        drug_name:
          type: string
        dose:
          type: string
          nullable: true
        frequency:
          type: string
          nullable: true
        duration:
          type: string
          nullable: true
        quantity:
          type: string
          nullable: true
        instructions:
          type: string
          nullable: true

    PrescriptionItemInput:
      type: object
      required: [drug_name]
      properties:
        drug_name:
          type: string
          maxLength: 255
        dose:
          type: string
          maxLength: 100
          nullable: true
        frequency:
          type: string
          maxLength: 100
          nullable: true
        duration:
          type: string
          maxLength: 100
          nullable: true
        quantity:
          type: string
          maxLength: 100
          nullable: true
        instructions:
          type: string
          nullable: true

    StorePrescriptionRequest:
      type: object
      required: [patient_id, items]
      properties:
        patient_id:
          type: integer
        encounter_id:
          type: integer
          nullable: true
        issued_at:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          nullable: true
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PrescriptionItemInput'

    # ── AI Analysis ───────────────────────────────────────────────────────────

    AiResult:
      description: |
        Source: AiAnalysisResultResource.
        The shape of the result object varies by analysis_type:
          xray_analysis       — findings, regions_of_interest, confidence scores
          soap_suggestion     — { subjective, objective, assessment, plan }
          prescription_suggestion — { medications: [{ drug_name, dose, frequency, duration, instructions }] }
          perio_risk          — { risk_level, risk_score, risk_factors[] }
      type: object
      properties:
        id:
          type: integer
        patient_id:
          type: integer
          nullable: true
        source_type:
          type: string
          description: "Morph type — e.g. document, encounter"
        source_id:
          type: integer
          nullable: true
        analysis_type:
          $ref: '#/components/schemas/AiAnalysisType'
        ai_provider:
          type: string
          nullable: true
          description: "e.g. google"
        ai_model:
          type: string
          nullable: true
          description: "e.g. gemini-flash"
        input_summary:
          type: string
          nullable: true
        result:
          type: object
          nullable: true
          description: Structured AI output — shape varies by analysis_type (see schema description above)
        status:
          $ref: '#/components/schemas/AiResultStatus'
        reviewer_notes:
          type: string
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        requested_by:
          description: User who triggered the analysis. Included when the requestedBy relation is loaded.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/User'
        reviewed_by:
          description: User who accepted or dismissed the result. Included when the reviewedBy relation is loaded.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/User'

    PatientAiInsights:
      description: Aggregated latest AI result per analysis type for a patient.
      type: object
      properties:
        patient_id:
          type: integer
        risk_summary:
          type: object
          properties:
            perio_risk_level:
              type: string
              nullable: true
            perio_risk_score:
              type: number
              nullable: true
        latest_results:
          type: object
          properties:
            xray_analysis:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/AiResult'
            soap_suggestion:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/AiResult'
            prescription_suggestion:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/AiResult'
            perio_risk:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/AiResult'

    CreatePrescriptionFromAiResponse:
      description: Response from POST /ai-results/{result}/create-prescription
      type: object
      properties:
        message:
          type: string
          example: Prescription created successfully.
        prescription:
          type: object
          properties:
            id:
              type: integer
            issued_at:
              type: string
              format: date-time
            items_count:
              type: integer
        ai_result:
          $ref: '#/components/schemas/AiResult'

    # ── Audit Logs ────────────────────────────────────────────────────────────

    AuditLog:
      description: |
        Source: AuditLogResource.
        IMPORTANT FIELD NAME CORRECTIONS vs v1:
          action     (not event)
          model_type (not auditable_type)
          model_id   (not auditable_id)
        model_type is the short class basename e.g. Patient, Invoice — not the full namespace.
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
          nullable: true
        action:
          $ref: '#/components/schemas/AuditAction'
        model_type:
          type: string
          description: Short class basename e.g. Patient, Invoice, Encounter
        model_id:
          type: integer
        old_values:
          type: object
          nullable: true
          description: Previous attribute values — null for created events
        new_values:
          type: object
          nullable: true
          description: New attribute values — null for deleted events
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        user:
          description: User who triggered the action. Included when the user relation is loaded.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/User'

    # ── Composite / special responses ─────────────────────────────────────────

    TimelineResponse:
      description: Unified patient timeline paginated response.
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [appointment, medical_case, document, encounter, prescription]
              date:
                type: string
                format: date-time
              data:
                type: object
                description: Full resource payload for the event type (matches the corresponding schema above)
        meta:
          type: object
          properties:
            current_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
            last_page:
              type: integer
            types:
              type: array
              items:
                type: string

    LedgerResponse:
      description: Patient billing ledger with totals.
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'
        summary:
          type: object
          properties:
            total_billed:
              type: number
              format: float
            total_paid:
              type: number
              format: float
            outstanding:
              type: number
              format: float
        meta:
          type: object
          properties:
            current_page:
              type: integer
            last_page:
              type: integer
            total:
              type: integer
            per_page:
              type: integer
