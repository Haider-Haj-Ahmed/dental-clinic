              data:
                $ref: '#/components/schemas/AuditLog'

    ReportResponse:
      description: Report data (structure varies per report — defined by ReportService)
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object

  schemas:

    # ── Shared ────────────────────────────────────────────────────────────────

    PaginatedMeta:
      type: object
      properties:
        meta:
          type: object
          properties:
            current_page:
              type: integer
            last_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
        links:
          type: object
          properties:
            first:
              type: string
            last:
              type: string
            prev:
              type: string
              nullable: true
            next:
              type: string
              nullable: true

    ErrorResponse:
      type: object
      properties:
        message:
          type: string

    ValidationErrorResponse:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    # ── Enums ─────────────────────────────────────────────────────────────────

    UserRole:
      type: string
      enum: [owner, receptionist, provider, assistant]

    AppointmentStatus:
      type: string
      enum: [scheduled, confirmed, completed, cancelled, no_show]

    RecallStatus:
      type: string
      enum: [pending, sent, booked, dismissed]

    InvoiceStatus:
      type: string
      enum: [draft, finalized, paid, partial, void]

    TreatmentPlanStatus:
      type: string
      enum: [draft, presented, accepted, rejected]

    DocumentType:
      type: string
      enum:
        - xray
        - panoramic
        - cephalometric
        - intraoral_photo
        - lab_result
        - referral_letter
        - consent_form
        - old_treatment_record
        - prescription_scan
        - other

    MedicalCaseType:
      type: string
      enum:
        - examination
        - extraction
        - filling
        - root_canal
        - crown
        - implant
        - orthodontics
        - periodontal
        - surgery
        - consultation
        - other

    OdontogramEntryType:
      type: string
      enum: [condition, procedure]

    PerioSite:
      type: string
      enum: [MB, B, DB, ML, L, DL]

    StockMovementType:
      type: string
      enum: [in, out, adjustment, expired]

    PurchaseOrderStatus:
      type: string
      enum: [pending, received, cancelled]

    AiAnalysisType:
      type: string
      enum: [xray_analysis, soap_suggestion, prescription_suggestion, perio_risk]

    AiResultStatus:
      type: string
      enum: [pending, accepted, dismissed]

    AuditAction:
      type: string
      enum: [created, updated, deleted, restored]

    # ── Auth ──────────────────────────────────────────────────────────────────

    LoginRequest:
      type: object
      required: [email, password, device_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        device_name:
          type: string
          maxLength: 255

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: Bearer token for all subsequent requests
        abilities:
          type: array
          items:
            type: string
          description: Token abilities granted based on the authenticated user role
        user:
          $ref: '#/components/schemas/User'

    # ── Core lookup models ────────────────────────────────────────────────────

    User:
      description: "Source: UserResource"
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    StoreUserRequest:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role:
          $ref: '#/components/schemas/UserRole'

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role:
          $ref: '#/components/schemas/UserRole'

    Operatory:
      description: "Source: OperatoryResource"
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        color:
          type: string
          nullable: true
          example: '#3B82F6'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    StoreOperatoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          nullable: true
        is_active:
          type: boolean
          default: true

    AppointmentType:
      description: "Source: AppointmentTypeResource. IMPORTANT: response field is default_duration_minutes not duration_minutes."
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        default_duration_minutes:
          type: integer
          nullable: true
        color:
          type: string
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    StoreAppointmentTypeRequest:
