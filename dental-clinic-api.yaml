          $ref: '#/components/responses/Forbidden'

  /reports/recall-performance:
    get:
      tags: [Dashboard & Reports]
      summary: Recall performance report (owner + receptionist only)
      parameters:
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          $ref: '#/components/responses/ReportResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /reports/inventory:
    get:
      tags: [Dashboard & Reports]
      summary: Inventory report (owner + receptionist only)
      parameters:
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - name: category
          in: query
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/ReportResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /audit-logs:
    get:
      tags: [Audit Logs]
      summary: List audit log entries (owner only)
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
        - name: model_type
          in: query
          description: Short class name e.g. Patient, Invoice, Encounter
          schema:
            type: string
        - name: user_id
          in: query
          schema:
            type: integer
        - name: action
          in: query
          schema:
            $ref: '#/components/schemas/AuditAction'
      responses:
        '200':
          $ref: '#/components/responses/AuditLogList'
        '403':
          $ref: '#/components/responses/Forbidden'

  /audit-logs/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Audit Logs]
      summary: Get an audit log entry (owner only)
      responses:
        '200':
          $ref: '#/components/responses/AuditLogItem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:

  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: Laravel Sanctum personal access token

  parameters:

    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer

    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15

    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1

    DateFrom:
      name: date_from
      in: query
      schema:
        type: string
        format: date

    DateTo:
      name: date_to
      in: query
      schema:
        type: string
        format: date

    ProviderIdFilter:
      name: provider_id
      in: query
      schema:
        type: integer

  responses:

    ValidationError:
      description: Unprocessable content
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Forbidden — insufficient role or token ability
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    TooManyRequests:
