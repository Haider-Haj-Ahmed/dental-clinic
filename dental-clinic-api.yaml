openapi: 3.0.3

info:
  title: Dental Clinic PMS API
  description: |
    RESTful API for a dental clinic practice management system.
    Covers authentication, patient records, appointments, clinical workflows,
    billing, inventory, AI-assisted analysis, and audit logging.

    All response schemas are derived directly from the Laravel API Resource
    classes (app/Http/Resources/). Every field listed in a response schema
    is exactly what the API returns. Fields described as "Included when loaded"
    are conditionally present — they appear only when the corresponding Eloquent
    relation is eager-loaded by the controller.

    ## Authentication
    All endpoints except POST /auth/login require a Bearer token.
    Tokens carry per-role abilities enforced by the token.ability middleware.

    ## Token Abilities by Role
    | Ability | owner | receptionist | provider | assistant |
    |---|---|---|---|---|
    | * (all) | yes | | | |
    | patients:read/write | yes | yes | read | read |
    | appointments:read/write | yes | yes | yes | read |
    | clinical:read/write | yes | read | yes | read |
    | billing:read/write | yes | yes | read | |
    | recalls:read/write | yes | yes | read | |
    | inventory:read/write | yes | yes | | |
    | schedule-blocks:read/write | yes | yes | read | read |
    | documents:write | yes | | yes | yes |

  version: 2.0.0
  contact:
    name: Haider Al-Haj Ahmed
    url: https://github.com/Haider-Haj-Ahmed/dental-clinic

servers:
  - url: /api/v1
    description: API v1

security:
  - sanctum: []

tags:
  - name: Auth
  - name: Users
  - name: Providers
  - name: Operatories
  - name: Appointment Types
  - name: Procedure Codes
  - name: Payment Methods
  - name: Patients
  - name: Patient Sub-Resources
  - name: Patient Medical Cases
  - name: Patient Documents
  - name: Appointments
  - name: Schedule Blocks
  - name: Recalls
  - name: Communication Logs
  - name: Encounters
  - name: Odontogram
  - name: Perio Exams
  - name: Treatment Plans
  - name: Prescriptions
  - name: Invoices
  - name: Payments
  - name: Payment Plans
  - name: Inventory
  - name: Suppliers
  - name: Purchase Orders
  - name: AI Analysis
  - name: Dashboard & Reports
  - name: Audit Logs

paths:

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and obtain a Bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke current token
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Revoke all tokens for the authenticated user
