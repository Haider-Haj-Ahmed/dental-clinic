        '403':
          $ref: '#/components/responses/Forbidden'

  /audit-logs/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Audit Logs]
      summary: Get an audit log entry
      responses:
        '200':
          $ref: '#/components/responses/AuditLogItem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

