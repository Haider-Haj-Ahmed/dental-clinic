openapi: 3.0.3

info:
  title: Dental Clinic PMS API
  description: |
    RESTful API for a dental clinic practice management system.
    Covers authentication, patient records, appointments, clinical workflows,
    billing, inventory, AI-assisted analysis, and audit logging.

    ## Authentication
    All endpoints (except `POST /auth/login`) require a Bearer token obtained via login.
    Tokens are issued with per-role abilities enforced by the `token.ability` middleware.

    ## Token Abilities by Role
    | Ability | owner | receptionist | provider | assistant |
    |---|---|---|---|---|
    | `*` (all) | ✓ | | | |
    | `patients:read/write` | ✓ | ✓ | read | read |
    | `appointments:read/write` | ✓ | ✓ | ✓ | read |
    | `clinical:read/write` | ✓ | read | ✓ | read |
    | `billing:read/write` | ✓ | ✓ | read | |
    | `recalls:read/write` | ✓ | ✓ | read | |
    | `inventory:read/write` | ✓ | ✓ | | |
    | `schedule-blocks:read/write` | ✓ | ✓ | read | read |
    | `documents:write` | ✓ | | ✓ | ✓ |

  version: 1.0.0
  contact:
    name: Haider Al-Haj Ahmed
    url: https://github.com/Haider-Haj-Ahmed/dental-clinic

servers:
  - url: /api/v1
    description: API v1

security:
  - sanctum: []

tags:
  - name: Auth
    description: Login, session info, logout
  - name: Users
    description: Staff user management (owner only)
  - name: Providers
    description: Dentist / provider profiles
  - name: Operatories
    description: Treatment rooms
  - name: Appointment Types
    description: Appointment type catalogue
  - name: Procedure Codes
    description: Dental procedure code catalogue
  - name: Payment Methods
    description: Payment method catalogue
  - name: Patients
    description: Patient demographic records
  - name: Patient Sub-Resources
    description: Contacts, allergies, conditions, medications, consents
  - name: Patient Medical Cases
    description: Historical and current case records
  - name: Patient Documents
    description: X-rays, photos, and other clinical documents
  - name: Appointments
    description: Scheduling and appointment management
  - name: Schedule Blocks
    description: Blocked time slots for providers / operatories
  - name: Recalls
    description: Recall scheduling and reminder dispatch
  - name: Communication Logs
    description: Outbound communication history
  - name: Encounters
    description: SOAP-format clinical encounter notes
  - name: Odontogram
    description: Per-tooth condition and procedure charting
  - name: Perio Exams
    description: Periodontal examination records and measurements
  - name: Treatment Plans
    description: Proposed treatment plan records
  - name: Prescriptions
    description: Medication prescription records
  - name: Invoices
    description: Billing invoices
  - name: Payments
    description: Payment records
  - name: Payment Plans
    description: Instalment payment plans
  - name: Inventory
    description: Inventory item management and stock movements
  - name: Suppliers
    description: Dental supply vendors
  - name: Purchase Orders
    description: Stock purchase orders
  - name: AI Analysis
    description: AI-assisted clinical insights (Phase 5)
  - name: Dashboard & Reports
    description: KPI dashboard and management reports
  - name: Audit Logs
    description: Immutable audit trail (owner only)

paths:

  # ── AUTH ──────────────────────────────────────────────────────────────────

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and obtain a Bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/User'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke current token
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Revoke all tokens for the authenticated user
      responses:
        '200':
          description: All sessions terminated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  # ── USERS ─────────────────────────────────────────────────────────────────

  /users:
    get:
      tags: [Users]
      summary: List staff users (owner only)
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          $ref: '#/components/responses/UserList'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      summary: Create a staff user (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreUserRequest'
      responses:
        '201':
          $ref: '#/components/responses/UserItem'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Users]
      summary: Get a user
      responses:
        '200':
          $ref: '#/components/responses/UserItem'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Users]
      summary: Update a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserItem'
    delete:
      tags: [Users]
      summary: Delete a user
      responses:
        '204':
          description: Deleted

  # ── OPERATORIES ───────────────────────────────────────────────────────────

  /operatories:
