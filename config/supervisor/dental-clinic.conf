; ══════════════════════════════════════════════════════════════
; Supervisor configuration — Crystalline Dental PMS
; Copy this file to /etc/supervisor/conf.d/dental-clinic.conf
; Then run: sudo supervisorctl reread && sudo supervisorctl update
; ══════════════════════════════════════════════════════════════

; ── Queue worker ─────────────────────────────────────────────
; Processes jobs from the 'jobs' table (mail, notifications, AI).
; Two processes for redundancy. Increase numprocs for high volume.
[program:dental-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/dental-clinic/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --queue=default,mail
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=2
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/dental-queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600

; ── Queue worker for high-priority mail only ──────────────────
; Dedicated worker for the 'mail' queue so email is never
; delayed by heavy AI or report jobs on the 'default' queue.
[program:dental-queue-mail]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/dental-clinic/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --queue=mail
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/dental-queue-mail.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stopwaitsecs=60

; ── Laravel Scheduler ─────────────────────────────────────────
; Runs every minute instead of a cron entry.
; Alternative to: * * * * * php artisan schedule:run
[program:dental-scheduler]
process_name=%(program_name)s
command=php /var/www/dental-clinic/artisan schedule:work
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/dental-scheduler.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
